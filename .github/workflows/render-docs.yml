# ИС ОСАГО — Lab 5: Diagrams-as-Code. Валидация и рендер C4-диаграмм.
# Ответственный: тимлид Таган А.М. (DevOps / релиз-инженер)
name: Auto Render C4 Architecture Docs

on:
  push:
    branches: [ main ]
    paths: [ 'architecture/**', '.github/workflows/render-docs.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'architecture/**', '.github/workflows/render-docs.yml' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PLANTUML_VERSION: "1.2024.7"
  GRAPHVIZ_DOT: "/usr/bin/dot"

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: architecture
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Graphviz Engine and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-liberation
          which dot
          dot -V
          echo "GRAPHVIZ_DOT=$(which dot)"

      - name: Download PlantUML Jar Executable
        run: |
          wget -q https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar -O plantuml.jar
          java -jar plantuml.jar -version | head -1

      - name: Validate Syntax and Compile Diagrams to PNG/SVG
        env:
          GRAPHVIZ_DOT: /usr/bin/dot
        run: |
          mkdir -p docs/images docs/images/team_tagan
          bash scripts/render.sh plantuml.jar 2>&1 | tee docs/ci_render.log

      - name: Build interactive architecture map
        run: python3 scripts/build_index.py

      - name: Upload artifacts (images + build logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c4-architecture-docs
          path: |
            architecture/docs/images
            architecture/docs/index.html
            architecture/docs/*.log

      - name: Commit and Push Rendered Artifacts
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          git config --global user.name 'DevOps Bot'
          git config --global user.email 'devops-bot@users.noreply.github.com'
          git add docs/images docs/index.html docs/*.log
          git commit -m 'docs: auto-update architecture diagrams [skip ci]' || echo 'No changes to commit'
          git push
